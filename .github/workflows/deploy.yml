name: Node.js CI/CD with Docker and EC2 Deploy

on:
  push:
    branches:
      - '**'

jobs:
  lint_and_unit_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

  build:
    needs: lint_and_unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run build (if needed)
        run: npm run build || echo "No build script, skip"

      - name: Build Docker Image
        run: docker build -t my-node-app .

      - name: Save Docker Image to .tar file
        run: docker save my-node-app -o my-node-app.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-node-app.tar

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "my-node-app.tar"
          target: "~"

      - name: Copy migrations folder to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "migrations"
          target: "~"

      - name: Deploy Docker container and run migrations
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker load -i ~/my-node-app.tar
            docker stop my-node-app || true
            docker rm my-node-app || true
            docker run -d --name my-node-app -p 5000:5000 my-node-app

            echo "Running migrations..."
            cd ~/migrations
            chmod +x migrate.sh
            ./migrate.sh

  integration_test:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    name: Integration Test with Newman
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Wait for App to be available
        run: sleep 10

      - name: Run Postman Tests
        run: |
          newman run collection/FPT.postman_collection.json \
            -e collection/fptTest.postman_environment.json \
            --folder "Test Fun Bug"
