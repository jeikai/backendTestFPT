name: Node.js CI/CD with Docker and EC2 Deploy

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Build (if needed)
        run: npm run build || echo "No build script, skip"

      - name: Build Docker Image
        run: docker build -t my-node-app .

      - name: Save Docker Image to .tar file
        run: docker save my-node-app -o my-node-app.tar

      - name: Upload Docker Image to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-node-app.tar

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Copy Docker Image to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "my-node-app.tar"
          target: "~/"

      - name: Copy migrations folder to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "migrations"
          target: "~"

      - name: Deploy Docker Container and Run Migrations
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker load -i ~/my-node-app.tar
            docker stop my-node-app || true
            docker rm my-node-app || true
            docker run -d --name my-node-app -p 80:3000 my-node-app

            echo "Running migrations..."
            cd ~/migrations
            chmod +x migrate.sh
            ./migrate.sh
